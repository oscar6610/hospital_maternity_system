<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Maternity System</title>
    
    <!-- SAP UI5 Web Components desde CDN -->
    <script type="importmap">
    {
        "imports": {
            "@ui5/webcomponents/": "https://cdn.jsdelivr.net/npm/@ui5/webcomponents@1.24.0/dist/",
            "@ui5/webcomponents-fiori/": "https://cdn.jsdelivr.net/npm/@ui5/webcomponents-fiori@1.24.0/dist/"
        }
    }
    </script>
    
    <script type="module">
        import "@ui5/webcomponents/dist/Assets.js";
        import "@ui5/webcomponents-fiori/dist/Assets.js";
        import "@ui5/webcomponents/dist/Icon.js";
        import "@ui5/webcomponents/dist/Button.js";
        import "@ui5/webcomponents/dist/Input.js";
        import "@ui5/webcomponents/dist/Card.js";
        import "@ui5/webcomponents/dist/Title.js";
        import "@ui5/webcomponents/dist/Label.js";
        import "@ui5/webcomponents/dist/MessageStrip.js";
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0070f2 0%, #0854a0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .login-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 3rem 2.5rem;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: #0070f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-logo svg {
            width: 50px;
            height: 50px;
            fill: white;
        }
        
        .login-title {
            color: #0854a0;
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: #6a6d70;
            font-size: 0.875rem;
        }
        
        .login-form {
            margin-top: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group ui5-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group ui5-input {
            width: 100%;
        }
        
        .login-actions {
            margin-top: 2rem;
        }
        
        .login-actions ui5-button {
            width: 100%;
        }
        
        .error-message {
            margin-bottom: 1.5rem;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e5e5;
        }
        
        .login-footer p {
            color: #6a6d70;
            font-size: 0.75rem;
        }
        
        @media (max-width: 500px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <h1 class="login-title">Hospital Maternity System</h1>
                <p class="login-subtitle">Fiori Launchpad</p>
            </div>
            
            {% if error %}
            <div class="error-message">
                <ui5-message-strip design="Negative">
                    {{ error }}
                </ui5-message-strip>
            </div>
            {% endif %}
            
            <form method="POST" class="login-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <ui5-label for="run">RUN</ui5-label>
                    <ui5-input 
                        id="run" 
                        name="run" 
                        placeholder="Ej: 12345678-9"
                        value="{{ run|default:'' }}"
                        required>
                        <ui5-icon slot="icon" name="employee"></ui5-icon>
                    </ui5-input>
                </div>
                
                <div class="form-group">
                    <ui5-label for="password">Contraseña</ui5-label>
                    <ui5-input 
                        id="password" 
                        name="password" 
                        type="Password"
                        placeholder="Ingresa tu contraseña"
                        required>
                        <ui5-icon slot="icon" name="locked"></ui5-icon>
                    </ui5-input>
                </div>
                
                <div class="login-actions">
                    <ui5-button 
                        type="Submit" 
                        design="Emphasized"
                        icon="log">
                        Iniciar Sesión
                    </ui5-button>
                </div>
            </form>
            
            <div class="login-footer">
                <p>&copy; 2025 Hospital Maternity System. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
    
    <script>
        // Validación básica del formulario
        document.querySelector('.login-form').addEventListener('submit', (e) => {
            const run = document.getElementById('run').value.trim();
            const password = document.getElementById('password').value;
            
            if (!run || !password) {
                e.preventDefault();
                alert('Por favor, completa todos los campos');
            }
        });
    </script>
</body>
</html>
